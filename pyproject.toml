[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-governor"
version = "0.1.0"
description = "Risk governance for AI outputs and actions: allow / scale / abstain verdicts, CVaR policies over user-defined costs, and auditable, re-verifiable decision records."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Annette A. Odingo"}]
keywords = ["ai-governance", "llm", "risk", "evals", "guardrails", "cvar", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base install: no LLM SDKs, no API keys. Numeric + storage + profiles only.
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",   # compliance profile loading (checks/profiles/*.yaml)
]

[project.optional-dependencies]
# Model-backed check defaults (style_drift, claims_supported), the pin
# freeze tool, and the G-7 judge adapter's provider SDKs. All imported
# lazily — never at package top level.
llm = [
  "huggingface_hub>=0.21",
  "sentence-transformers>=2.4",
  "transformers>=4.39",
  "openai>=1.30",
  "anthropic>=0.34",
]
fastapi = ["fastapi>=0.110"]
a11y = []         # axe-core bridge deps land in G-6 if the timebox allows
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.98",
  "mypy>=1.8",
  "ruff>=0.3",
  "pre-commit>=3.6",
  "wheel>=0.43",   # the packaging smoke test builds a real wheel
  "fastapi>=0.110",  # CI exercises the real Depends path (base-import test still blocks it)
  "httpx>=0.27",     # fastapi.testclient's transport
]

[project.urls]
Repository = "https://github.com/DecisionGovernance/decision-governor"
Documentation = "https://github.com/DecisionGovernance/decision-governor"

[project.scripts]
governor = "decision_governor.instrumentation.cli:main"

[tool.setuptools.packages.find]
include = ["decision_governor*"]

[tool.setuptools.package-data]
decision_governor = ["checks/profiles/*.yaml", "adversarial/data/*.jsonl", "adversarial/action.yml"]

[tool.mypy]
python_version = "3.10"
strict = false

[[tool.mypy.overrides]]
module = ["decision_governor.core.*", "decision_governor.risk.*"]
strict = true          # the frozen contracts are held to the highest bar

[[tool.mypy.overrides]]
# Optional model/serialization deps: imported lazily, absent on the base
# install by design.
module = [
  "huggingface_hub", "sentence_transformers", "transformers", "yaml",
  "fastapi", "openai", "anthropic",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# The FastAPI dependency-injection idiom: Depends() in a default is the API.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
addopts = "-q --cov=decision_governor --cov-report=term-missing"
testpaths = ["tests"]
