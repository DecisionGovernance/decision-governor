[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-governor"
version = "0.1.0.dev0"
description = "Risk governance for AI outputs and actions: allow / scale / abstain verdicts, CVaR policies over user-defined costs, and auditable, re-verifiable decision records."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Annette A. Odingo"}]
keywords = ["ai-governance", "llm", "risk", "evals", "guardrails", "cvar", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base install: no LLM SDKs, no API keys. Numeric + storage only.
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
llm = []          # judge adapter deps land in G-7 (pinned there, not here)
fastapi = ["fastapi>=0.110"]
a11y = []         # axe-core bridge deps land in G-6 if the timebox allows
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.98",
  "mypy>=1.8",
  "ruff>=0.3",
  "pre-commit>=3.6",
]

[project.urls]
Repository = "https://github.com/DecisionGovernance/decision-governor"
Documentation = "https://github.com/DecisionGovernance/decision-governor"

[project.scripts]
governor = "decision_governor.instrumentation.cli:main"

[tool.setuptools.packages.find]
include = ["decision_governor*"]

[tool.mypy]
python_version = "3.10"
strict = false

[[tool.mypy.overrides]]
module = ["decision_governor.core.*", "decision_governor.risk.*"]
strict = true          # the frozen contracts are held to the highest bar

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q --cov=decision_governor --cov-report=term-missing"
testpaths = ["tests"]
